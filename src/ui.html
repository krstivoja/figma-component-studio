<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Component Studio</title>
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #18a0fb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #c7c7c7;
        cursor: not-allowed;
      }
      button.secondary {
        background: #fff;
        color: #1a1a1a;
        box-shadow: inset 0 0 0 1px #c7c7c7;
      }
      button.secondary:disabled {
        color: #999;
        background: #f5f5f5;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #0d6efd;
        outline-offset: 1px;
      }
      h2 {
        font-size: 12px;
        margin: 0;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 8px;
        min-height: 20px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 11px;
        line-height: 16px;
        white-space: nowrap;
        background: #f5f5f5;
        color: #555;
      }
      .pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9e9e9e;
        flex: none;
      }
      .pill.connected {
        background: #e8f5e9;
        color: #1b5e20;
      }
      .pill.connected .dot {
        background: #2e7d32;
      }
      .pill.conflict {
        background: #fff4e5;
        color: #8a4b00;
      }
      .pill.conflict .dot {
        background: #f0a020;
      }
      .stored-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 0 0 8px;
        border: 1px solid #ce93d8;
        background: #f3e5f5;
      }
      .stored-banner span {
        flex: 1;
      }
      .stored-banner button {
        width: auto;
        padding: 4px 12px;
      }
      button.small {
        width: auto;
        padding: 2px 8px;
        font-weight: 500;
        font-size: 11px;
      }
      td.badges {
        line-height: 18px;
      }
      td.badges > * + * {
        margin-left: 4px;
      }
      td.adopt {
        width: 42%;
        min-width: 240px;
      }
      .adopt-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .adopt-row > div {
        flex: 1 0 100%;
        min-width: 0;
      }
      .raw-value {
        display: block;
        font-weight: 600;
      }
      .raw-token {
        display: block;
        color: #777;
        font-size: 11px;
      }
      h3 {
        font-size: 12px;
        margin: 12px 0 4px;
      }
      #component {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .steps {
        display: flex;
        gap: 8px;
      }
      .hint {
        margin: 6px 0 0;
      }
      #step-title {
        margin: 4px 0;
      }
      #status {
        margin: 6px 0;
        color: #555;
        min-height: 14px;
      }
      #status.error {
        color: #c62828;
        font-weight: 600;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .muted {
        color: #777;
        font-size: 11px;
      }
      .warnings {
        background: #fff4e5;
        border: 1px solid #f0a020;
        border-radius: 6px;
        padding: 6px 8px 6px 24px;
        margin: 0 0 8px;
      }
      .loud {
        background: #fdecea;
        border: 2px solid #c62828;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 8px 0;
      }
      .loud strong {
        color: #c62828;
      }
      .intended {
        background: #f5f5f5;
        border: 1px solid #c7c7c7;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 8px 0;
      }
      .pass {
        color: #1b7f3b;
        font-weight: 600;
      }
      .name-field label {
        white-space: nowrap;
      }
      .name-field {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 4px 0 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-weight: 600;
        color: #555;
        border-bottom: 1px solid #e5e5e5;
        padding: 3px 4px;
      }
      td {
        padding: 3px 4px;
        border-bottom: 1px solid #f0f0f0;
        vertical-align: middle;
      }
      tr.off td {
        opacity: 0.5;
      }
      td.nowrap {
        white-space: nowrap;
      }
      input[type="text"],
      select {
        font: inherit;
        width: 100%;
        padding: 2px 4px;
        border: 1px solid #c7c7c7;
        border-radius: 4px;
        min-width: 0;
      }
      input.invalid {
        border-color: #c62828;
      }
      .field-error {
        color: #c62828;
        font-size: 11px;
      }
      .indent {
        display: inline-block;
      }
      .arrow {
        color: #999;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 0 5px;
        border-radius: 8px;
        font-size: 10px;
        background: #eee;
        white-space: nowrap;
      }
      .badge.new {
        background: #e3f2fd;
        color: #0d47a1;
      }
      .badge.existing {
        background: #ede7f6;
        color: #4527a0;
      }
      .badge.exact {
        background: #e8f5e9;
        color: #1b5e20;
      }
      .badge.nearest {
        background: #fff4e5;
        color: #8a4b00;
      }
      .badge.manual {
        background: #fff4e5;
        color: #8a4b00;
        box-shadow: inset 0 0 0 1px #f0a020;
      }
      .badge.user {
        background: #e0f2f1;
        color: #00695c;
      }
      .badge.claude {
        background: #f3e5f5;
        color: #6a1b9a;
      }
      .badge.rules {
        background: #eceff1;
        color: #37474f;
      }
      .badge.suggested {
        background: #e8f5e9;
        color: #1b5e20;
      }
      .badge.wrap {
        background: #e0f7fa;
        color: #006064;
      }
      .badge.alias-change {
        background: #fff4e5;
        color: #8a4b00;
        box-shadow: inset 0 0 0 1px #f0a020;
      }
      .badge.rebind {
        background: #e8eaf6;
        color: #283593;
      }
      td.alias {
        width: 28%;
        min-width: 160px;
      }
      td.alias .was {
        color: #8a4b00;
        font-size: 11px;
        margin-bottom: 2px;
      }
      .badge.rename {
        background: #e8f5e9;
        color: #1b5e20;
      }
      td .was-name {
        color: #777;
        font-size: 11px;
        margin-bottom: 2px;
        text-decoration: line-through;
      }
      .renamed-tokens {
        background: #f5f5f5;
        border: 1px solid #c7c7c7;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 8px 0;
      }
      .renamed-tokens .raw-head {
        margin: 0;
      }
      .renamed-tokens pre {
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 4px 0 0;
      }
      .badge[hidden] {
        display: none;
      }
      .raw-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 12px 0 4px;
      }
      .raw-head h3 {
        margin: 0;
      }
      .badge.off-vocab {
        background: #fff4e5;
        color: #8a4b00;
        box-shadow: inset 0 0 0 1px #f0a020;
      }
      .source {
        white-space: nowrap;
      }
      .naming-banner {
        border-radius: 6px;
        padding: 6px 8px;
        margin: 0 0 8px;
        border: 1px solid #ce93d8;
        background: #f3e5f5;
      }
      .naming-banner.warning {
        border-color: #f0a020;
        background: #fff4e5;
      }
      .step {
        flex: 1;
        min-width: 0;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        cursor: pointer;
      }
      .toggle input {
        margin: 0;
      }
      .toggle-help {
        margin: 2px 0 0;
      }
      .alias label {
        display: block;
        color: #777;
        font-size: 10px;
      }
      .picker-label {
        display: block;
        color: #777;
        font-size: 10px;
      }
      .tp-trigger {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        min-width: 0;
        height: 22px;
        padding: 0 4px 0 5px;
        background: #fff;
        color: #1a1a1a;
        border: 1px solid #c7c7c7;
        border-radius: 4px;
        font: inherit;
        font-weight: 400;
        text-align: left;
      }
      .tp-trigger:hover {
        border-color: #999;
      }
      .tp-trigger[aria-expanded="true"] {
        border-color: #0d6efd;
      }
      .tp-value {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tp-value.placeholder {
        color: #777;
      }
      .tp-chevron {
        flex: none;
        color: #777;
      }
      .tp-swatch {
        flex: none;
        width: 14px;
        height: 14px;
        border-radius: 2px;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
        background-color: #fff;
      }
      .tp-swatch.checker {
        background-color: #fff;
        background-image: linear-gradient(var(--swatch), var(--swatch)),
          conic-gradient(#d0d0d0 25%, #fff 0 50%, #d0d0d0 0 75%, #fff 0);
        background-size: 100% 100%, 6px 6px;
      }
      .tp-swatch.unknown {
        background-image: linear-gradient(135deg, transparent 45%, #c7c7c7 45% 55%, transparent 55%);
      }
      .tp-popup {
        position: fixed;
        z-index: 10;
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #c7c7c7;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
        overflow: hidden;
      }
      .tp-popup input.tp-search {
        flex: none;
        margin: 6px;
        width: auto;
        padding: 3px 6px;
      }
      .tp-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 0 4px;
      }
      .tp-group-label {
        padding: 6px 8px 2px;
        color: #777;
        font-size: 10px;
        font-weight: 600;
      }
      .tp-option {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px 0 6px;
        height: 24px;
        cursor: default;
      }
      .tp-option.active {
        background: #e5f4ff;
      }
      .tp-check {
        flex: none;
        color: #0d6efd;
      }
      .tp-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tp-hex {
        flex: none;
        color: #777;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .tp-empty {
        padding: 4px 8px 10px;
        color: #777;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid #e5e5e5;
      }
      .actions .counts {
        flex: 1;
      }
      .actions button {
        width: auto;
        padding: 6px 16px;
      }
    </style>
  </head>
  <body>
    <section id="component" aria-labelledby="component-title">
      <div class="head">
        <h2 id="component-title">Component Studio</h2>
        <span id="bridge-status" class="pill disconnected" role="status" aria-live="polite"
          ><span class="dot" aria-hidden="true"></span><span id="bridge-status-text">Claude not connected</span></span
        >
      </div>
      <div class="steps">
        <div class="step">
          <button id="scan-rename">1. Rename layers</button>
          <label class="toggle"><input type="checkbox" id="use-claude" aria-describedby="use-claude-help" /> Help with Claude Code</label>
          <p id="use-claude-help" class="muted toggle-help">
            Off: automatic names from the built-in rules. On: uses names Claude Code stored on the component (ask Claude Code to 'name this component' first).
          </p>
        </div>
        <div class="step">
          <button id="scan-tokens" class="secondary">2. Create tokens</button>
        </div>
      </div>
      <p class="hint muted">Rename first, then create tokens. Token names are built from layer names.</p>
      <h3 id="step-title" hidden></h3>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="stored-banner" class="stored-banner" role="status" hidden>
        <span id="stored-text"></span>
        <button id="stored-load" type="button">Load it</button>
      </div>
      <div id="review" class="scroll" hidden></div>
      <div id="review-actions" class="actions" hidden>
        <span id="counts" class="counts"></span>
        <button id="cancel" class="secondary">Cancel</button>
        <button id="apply">Apply</button>
      </div>
      <div id="result" class="scroll" hidden></div>
    </section>
    <!-- SCRIPT -->
  </body>
</html>
