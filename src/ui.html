<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Component Studio</title>
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font: 12px -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #18a0fb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: #c7c7c7;
        cursor: not-allowed;
      }
      button.secondary {
        background: #fff;
        color: #1a1a1a;
        box-shadow: inset 0 0 0 1px #c7c7c7;
      }
      button.secondary:disabled {
        color: #999;
        background: #f5f5f5;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #0d6efd;
        outline-offset: 1px;
      }
      h2 {
        font-size: 12px;
        margin: 0 0 8px;
      }
      h3 {
        font-size: 12px;
        margin: 12px 0 4px;
      }
      #component {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .steps {
        display: flex;
        gap: 8px;
      }
      .hint {
        margin: 6px 0 0;
      }
      #step-title {
        margin: 4px 0;
      }
      #status {
        margin: 6px 0;
        color: #555;
        min-height: 14px;
      }
      #status.error {
        color: #c62828;
        font-weight: 600;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .muted {
        color: #777;
        font-size: 11px;
      }
      .warnings {
        background: #fff4e5;
        border: 1px solid #f0a020;
        border-radius: 6px;
        padding: 6px 8px 6px 24px;
        margin: 0 0 8px;
      }
      .loud {
        background: #fdecea;
        border: 2px solid #c62828;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 8px 0;
      }
      .loud strong {
        color: #c62828;
      }
      .pass {
        color: #1b7f3b;
        font-weight: 600;
      }
      .name-field label {
        white-space: nowrap;
      }
      .name-field {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 4px 0 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-weight: 600;
        color: #555;
        border-bottom: 1px solid #e5e5e5;
        padding: 3px 4px;
      }
      td {
        padding: 3px 4px;
        border-bottom: 1px solid #f0f0f0;
        vertical-align: middle;
      }
      tr.off td {
        opacity: 0.5;
      }
      input[type="text"],
      select {
        font: inherit;
        width: 100%;
        padding: 2px 4px;
        border: 1px solid #c7c7c7;
        border-radius: 4px;
        min-width: 0;
      }
      input.invalid {
        border-color: #c62828;
      }
      .field-error {
        color: #c62828;
        font-size: 11px;
      }
      .indent {
        display: inline-block;
      }
      .arrow {
        color: #999;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 0 5px;
        border-radius: 8px;
        font-size: 10px;
        background: #eee;
        white-space: nowrap;
      }
      .badge.new {
        background: #e3f2fd;
        color: #0d47a1;
      }
      .badge.existing {
        background: #ede7f6;
        color: #4527a0;
      }
      .badge.exact {
        background: #e8f5e9;
        color: #1b5e20;
      }
      .badge.nearest {
        background: #fff4e5;
        color: #8a4b00;
      }
      .alias label {
        display: block;
        color: #777;
        font-size: 10px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid #e5e5e5;
      }
      .actions .counts {
        flex: 1;
      }
      .actions button {
        width: auto;
        padding: 6px 16px;
      }
    </style>
  </head>
  <body>
    <section id="component" aria-labelledby="component-title">
      <h2 id="component-title">Component Studio</h2>
      <div class="steps">
        <button id="scan-rename">1. Rename layers</button>
        <button id="scan-tokens" class="secondary">2. Create tokens</button>
      </div>
      <p class="hint muted">Rename first, then create tokens. Token names are built from layer names.</p>
      <h3 id="step-title" hidden></h3>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="review" class="scroll" hidden></div>
      <div id="review-actions" class="actions" hidden>
        <span id="counts" class="counts"></span>
        <button id="cancel" class="secondary">Cancel</button>
        <button id="apply">Apply</button>
      </div>
      <div id="result" class="scroll" hidden></div>
    </section>
    <!-- SCRIPT -->
  </body>
</html>
